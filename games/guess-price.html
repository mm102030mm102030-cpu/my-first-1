<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="stylesheet" href="../css/theme-override.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>خمن السعر</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap');

        :root {
            --primary: #6366f1; --primary-dark: #4338ca;
            --accent: #f59e0b; --accent-dark: #b45309;
            --danger: #ef4444; --danger-dark: #b91c1c;
            --success: #10b981; --success-dark: #047857;
            --bg: #1e1b4b; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: var(--bg);
            background-image: radial-gradient(circle at top left, #312e81 0%, transparent 70%);
            min-height: 100vh;
            color: white; display: flex; flex-direction: column;
            user-select: none; -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; z-index: 10; }
        .top-btn { background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 20px; color: white; font-weight: bold; font-size: 14px; cursor: pointer; border: none; font-family: 'Tajawal', sans-serif; text-decoration: none; transition: background 0.2s; display: inline-flex; align-items: center; justify-content: center; }
        .top-btn:hover { background: rgba(255,255,255,0.2); }
        .game-title { font-size: 20px; font-weight: 900; text-shadow: 0 4px 0 rgba(0,0,0,0.3); margin: 0; color: #fff;}

        .screen { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; padding: 20px; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-align: center; overflow-y: auto; overflow-x: hidden; width:100%; }
        .screen.active { display: flex; }
        @keyframes popIn { from { opacity:0; transform: scale(0.9); } to { opacity:1; transform: scale(1); } }
        @keyframes popUp { from { opacity:0; transform: translateY(50px); } to { opacity:1; transform: translateY(0); } }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 10px var(--accent); } 50% { box-shadow: 0 0 30px var(--accent); } 100% { box-shadow: 0 0 10px var(--accent); } }

        .btn {
            background: var(--primary); color: white; border: none; border-radius: 16px;
            padding: 16px 24px; font-size: 20px; font-weight: 900; font-family: 'Tajawal', sans-serif;
            box-shadow: 0 6px 0 var(--primary-dark), 0 10px 15px rgba(0,0,0,0.3);
            cursor: pointer; transition: all 0.1s; text-align: center; margin: 10px; width: 100%; max-width: 300px;
        }
        .btn:active { transform: translateY(6px); box-shadow: 0 0px 0 var(--primary-dark), 0 2px 5px rgba(0,0,0,0.3); }
        .btn-accent { background: var(--accent); box-shadow: 0 6px 0 var(--accent-dark), 0 10px 15px rgba(0,0,0,0.3); color: black;}
        .btn-accent:active { transform: translateY(6px); box-shadow: 0 0px 0 var(--accent-dark), 0 2px 5px rgba(0,0,0,0.3); }
        .btn-success { background: var(--success); box-shadow: 0 6px 0 var(--success-dark), 0 10px 15px rgba(0,0,0,0.3); }
        .btn-success:active { transform: translateY(6px); box-shadow: 0 0px 0 var(--success-dark), 0 2px 5px rgba(0,0,0,0.3); }

        .card-3d { background: #2e2a5d; border-radius: 24px; padding: 24px; margin-bottom: 20px; box-shadow: 0 8px 0 #1e1b4b, inset 0 2px 0 rgba(255,255,255,0.1); width: 100%; max-width: 400px; text-align: right;}
        .card-title { font-size: 20px; font-weight: 900; margin-bottom: 16px; color: #a5b4fc; text-align: right;}

        .stepper { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.2); border-radius: 20px; padding: 12px; margin-bottom: 12px; }
        .step-btn { width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.1); color: white; font-size: 24px; font-weight: 900; border: none; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.2); transition: 0.1s; }
        .step-btn:active { transform: translateY(4px); box-shadow: 0 0 0 rgba(0,0,0,0); }
        .step-val { font-size: 32px; font-weight: 900; text-align: center; width: 60px; }

        .names-list { display: flex; flex-direction: column; gap: 16px; max-height: 50vh; overflow-y: auto; padding: 10px 0; width: 100%; max-width: 400px;}
        .name-input { background: rgba(0,0,0,0.2); border: none; border-radius: 16px; padding: 18px 24px; color: white; font-size: 20px; font-weight: 800; font-family: 'Tajawal', sans-serif; width: 100%; box-sizing: border-box; box-shadow: inset 0 4px 8px rgba(0,0,0,0.3); outline: none; transition: 0.2s;}
        .name-input:focus { background: rgba(0,0,0,0.4); box-shadow: inset 0 4px 8px rgba(0,0,0,0.5), 0 0 0 2px var(--primary); }

        /* Numpad styles */
        .numpad-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 320px; margin-top: 15px; }
        .numpad-btn { background: rgba(255,255,255,0.1); border: none; border-radius: 12px; padding: 15px; font-size: 24px; font-weight: 900; color: white; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.2); transition: 0.1s; font-family: 'Tajawal', sans-serif;}
        .numpad-btn:active { transform: translateY(4px); box-shadow: 0 0 0 rgba(0,0,0,0); background: rgba(255,255,255,0.2);}
        .numpad-action { background: var(--primary); box-shadow: 0 4px 0 var(--primary-dark); }
        .numpad-action:active { box-shadow: 0 0 0 var(--primary-dark); }
        .numpad-delete { background: var(--danger); box-shadow: 0 4px 0 var(--danger-dark); }
        .numpad-delete:active { box-shadow: 0 0 0 var(--danger-dark); }

        .price-display { background: rgba(0,0,0,0.3); border-radius: 16px; padding: 10px; font-size: 36px; font-weight: 900; color: var(--accent); text-align: center; width: 100%; max-width: 320px; box-shadow: inset 0 4px 8px rgba(0,0,0,0.3); margin-bottom: 10px; min-height: 60px; display:flex; align-items:center; justify-content:center; letter-spacing: 2px;}

        .product-image-container { width: 100%; max-width: 300px; height: 180px; border-radius: 16px; overflow: hidden; margin-bottom: 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); border: 3px solid rgba(255,255,255,0.1); position: relative; background: #fff;}
        .product-image { width: 100%; height: 100%; object-fit: contain; }
        .product-title { font-size: 22px; font-weight: 900; margin-bottom: 5px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .product-desc { font-size: 14px; opacity: 0.8; margin-bottom: 10px; max-width: 350px; line-height: 1.4; }

        /* Timer */
        .timer-bar-bg { width: 100%; max-width: 350px; height: 12px; background: rgba(0,0,0,0.3); border-radius: 6px; overflow: hidden; margin-bottom: 15px; }
        .timer-bar-fill { height: 100%; background: var(--success); transition: width 1s linear, background 0.3s; width: 100%; }

        /* Black Pass Screen */
        #screen-pass { background: #000; z-index: 100; position: fixed; top: 0; left: 0; right: 0; bottom: 0; }

        /* Results Board */
        .guess-card { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 12px 20px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 2px solid transparent; width: 100%; max-width: 350px; animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; opacity: 0; transform: translateY(20px);}
        .guess-card.winner { border-color: var(--accent); background: rgba(245, 158, 11, 0.1); animation: popUp 0.5s forwards, pulseGlow 2s infinite; }
        .guess-card.exact { border-color: var(--success); background: rgba(16, 185, 129, 0.1); }
        .guess-card.over { opacity: 0.5; }
        
        .huge-reveal { font-size: 60px; font-weight: 900; color: var(--accent); text-shadow: 0 0 20px rgba(245, 158, 11, 0.5), 0 4px 0 rgba(0,0,0,0.5); margin: 20px 0; display:none;}
        
        .podium { 
            display: flex; align-items: flex-end; justify-content: center; gap: 16px; 
            margin-top: 50px; height: 260px; width: 100%; max-width: 400px;
            border-bottom: 4px solid rgba(255, 255, 255, 0.1); padding-bottom: 0px;
        }
        .podium-place { display: flex; flex-direction: column; align-items: center; width: 110px; position: relative; animation: slideUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; }
        .podium-score {
            font-size: 24px; font-weight: 900; color: #fbbf24; text-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
            margin-bottom: 12px;
        }
        .podium-bar { 
            width: 100%; border-radius: 20px 20px 0 0; 
            display: flex; justify-content: center; padding-top: 20px; 
            font-size: 48px; font-weight: 900; color: white; 
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
            box-shadow: inset 0 8px 16px rgba(255,255,255,0.2), 0 -8px 24px rgba(0,0,0,0.4);
            position: relative;
        }
        
        .podium-place.rank-2 .podium-bar { height: 140px; background: linear-gradient(180deg, #94a3b8 0%, #475569 100%); }
        .podium-place.rank-1 .podium-bar { height: 190px; background: linear-gradient(180deg, #f59e0b 0%, #b45309 100%); z-index: 2; box-shadow: inset 0 8px 16px rgba(255,255,255,0.3), 0 0 30px rgba(245, 158, 11, 0.4); }
        .podium-place.rank-3 .podium-bar { height: 100px; background: linear-gradient(180deg, #b45309 0%, #78350f 100%); }
        
        .podium-name {
            font-weight: 800; font-size: 16px; color: white; margin-top: 15px; 
            text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            background: rgba(255,255,255,0.1); padding: 8px; border-radius: 12px;
            backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1);
        }
        .crown { position: absolute; top: -60px; font-size: 45px; filter: drop-shadow(0 4px 10px rgba(245,158,11,0.6)); animation: float 2s infinite ease-in-out; }
        
        @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes float { 0% { transform: translateY(0); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0); } }

    </style>
<script src="../js/protection.js"></script>
</head>
<body>

    <div class="top-bar">
    <button onclick="confirmExit()" class="top-btn">🏠 الرئيسية</button>
    
    <div style="font-weight: 900; letter-spacing: -0.5px; font-size: 20px; text-shadow: 0 4px 0 rgba(0,0,0,0.3); color: #fff;">خمن السعر</div>
</div>

    <!-- Screen 1: Setup -->
    <div id="screen-setup" class="screen active">
        <h1 class="title">إعداد الجلسة</h1>
        
        <div class="card-3d">
            <div class="card-title">🔄 عدد الجولات</div>
            <div class="stepper">
                <button class="step-btn" onclick="adjRounds(-5)">-</button>
                <div>
                    <div class="step-val" id="val-rounds">5</div>
                    <div style="font-size:14px; opacity:0.6; text-align:center;">جولات</div>
                </div>
                <button class="step-btn" onclick="adjRounds(5)">+</button>
            </div>
        </div>

        <div class="card-3d">
            <div class="card-title">👥 عدد اللاعبين</div>
            <div class="stepper">
                <button class="step-btn" onclick="adjPlayers(-1)">-</button>
                <div>
                    <div class="step-val" id="val-players">3</div>
                    <div style="font-size:14px; opacity:0.6; text-align:center;">لاعبين</div>
                </div>
                <button class="step-btn" onclick="adjPlayers(1)">+</button>
            </div>
        </div>
        
        <button class="btn btn-primary" onclick="goToNames()">التالي ➡</button>
    </div>

    <!-- Screen 2: Names -->
    <div id="screen-names" class="screen">
        <h1 class="title">أسماء المتنافسين ✍️</h1>
        <div class="names-list" id="names-list"></div>
        <button class="btn btn-accent" style="margin-top:20px;" onclick="startGame()">ابدأ التحدي 🚀</button>
    </div>

    <!-- Screen 3: Pass Device -->
    <div id="screen-pass" class="screen">
        <div style="font-size: 80px; margin-bottom:20px;">📱</div>
        <h2 style="font-size: 24px; opacity:0.8; margin-bottom: 10px;">دور اللاعب:</h2>
        <h1 id="pass-player-name" style="font-size: 50px; color: var(--accent); margin-bottom: 40px; text-shadow: 0 4px 0 rgba(0,0,0,0.5);">أحمد</h1>
        <p style="opacity:0.6; margin-bottom:40px;">يرجى تسليم الهاتف للاعب المذكور، ولا تدع أحداً يرى شاشتك!</p>
        <button class="btn btn-success" onclick="startGuessing()">أنا جاهز، اكشف المنتج 👀</button>
    </div>

    <!-- Screen 4: Guessing -->
    <div id="screen-guess" class="screen">
        <div class="timer-bar-bg"><div class="timer-bar-fill" id="timer-bar"></div></div>
        
        <div class="product-image-container">
            <img id="prod-img" class="product-image" src="" alt="Product">
        </div>
        <div id="prod-title" class="product-title">اسم المنتج</div>
        <div id="prod-desc" class="product-desc">وصف المنتج القصير جدا</div>
        
        <div class="price-display">
            <span id="price-input" style="margin-left: 5px;"></span> <span style="font-size:20px; opacity:0.7;">$</span>
        </div>

        <div class="numpad-container">
            <button class="numpad-btn" onclick="typeNum(1)">1</button>
            <button class="numpad-btn" onclick="typeNum(2)">2</button>
            <button class="numpad-btn" onclick="typeNum(3)">3</button>
            <button class="numpad-btn" onclick="typeNum(4)">4</button>
            <button class="numpad-btn" onclick="typeNum(5)">5</button>
            <button class="numpad-btn" onclick="typeNum(6)">6</button>
            <button class="numpad-btn" onclick="typeNum(7)">7</button>
            <button class="numpad-btn" onclick="typeNum(8)">8</button>
            <button class="numpad-btn" onclick="typeNum(9)">9</button>
            <button class="numpad-btn numpad-delete" onclick="deleteNum()">⌫</button>
            <button class="numpad-btn" onclick="typeNum(0)">0</button>
            <button class="numpad-btn numpad-action" onclick="submitGuess()">✓</button>
        </div>
    </div>

    <!-- Screen 5: Round Reveal -->
    <div id="screen-reveal" class="screen">
        <h2 style="margin-bottom: 5px;">السعر الحقيقي هو:</h2>
        <div id="actual-price-reveal" class="huge-reveal">0$</div>
        
        <div id="guesses-list" style="width:100%; display:flex; flex-direction:column; align-items:center; margin-top:20px; flex:1; overflow-y:auto;">
            <!-- Guesses injected here -->
        </div>

        <button id="btn-next-round" class="btn btn-primary" style="display:none; margin-top:20px;" onclick="nextRoundAction()">الجولة التالية</button>
    </div>

    <!-- Screen 6: Final Podium -->
    <div id="screen-podium" class="screen">
        <div style="font-size: 60px; margin-bottom:10px;">🏁</div>
        <h1 class="title" style="color:var(--accent);">نهاية اللعبة!</h1>
        
        <div class="podium" id="podium-container">
            <!-- Podium injected here -->
        </div>

        <div class="card-3d" id="stats-card" style="margin-top:40px; text-align:center;">
            <!-- Stats injected here -->
        </div>

        <div style="display:flex; gap: 10px; margin-top: 20px; width: 100%; max-width: 400px;">
            <button class="btn btn-primary" style="flex:1; margin:0;" onclick="location.reload()">لعب مرة أخرى</button>
            <button class="btn" style="flex:1; margin:0; background:rgba(255,255,255,0.1); box-shadow:none;" onclick="window.location.href='../index.html'">الرئيسية</button>
        </div>
    </div>

        // State
        let state = {
            numRounds: 5,
            numPlayers: 3,
            players: [],
            gameDeck: [],
            currentRound: 0,
            currentPlayerIndex: 0,
            currentProduct: null,
            guessesThisRound: [], // {playerName, guess}
            timerInterval: null
        };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if(type === 'tick') {
                osc.type = 'square'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'type') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'reveal') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'win') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                setTimeout(() => {
                    const o2 = audioCtx.createOscillator(); const g2 = audioCtx.createGain();
                    o2.connect(g2); g2.connect(audioCtx.destination);
                    o2.type = 'sine'; o2.frequency.setValueAtTime(659.25, audioCtx.currentTime);
                    g2.gain.setValueAtTime(0.1, audioCtx.currentTime); g2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    o2.start(); o2.stop(audioCtx.currentTime + 0.5);
                }, 150);
            }
        }

        // Navigation
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // Setup
        function adjRounds(n) {
            state.numRounds += n;
            if(state.numRounds < 5) state.numRounds = 5;
            if(state.numRounds > 20) state.numRounds = 20;
            document.getElementById('val-rounds').innerText = state.numRounds;
        }

        function adjPlayers(n) {
            state.numPlayers += n;
            if(state.numPlayers < 2) state.numPlayers = 2;
            if(state.numPlayers > 10) state.numPlayers = 10;
            document.getElementById('val-players').innerText = state.numPlayers;
        }

        function goToNames() {
            showScreen('screen-names');
            const list = document.getElementById('names-list');
            list.innerHTML = '';
            for(let i=0; i<state.numPlayers; i++) {
                list.innerHTML += `<input type="text" class="name-input" id="pname-${i}" placeholder="اللاعب ${i+1}" />`;
            }
        }

        function startGame() {
            state.players = [];
            for(let i=0; i<state.numPlayers; i++) {
                let name = document.getElementById(`pname-${i}`).value.trim();
                if(!name) name = `اللاعب ${i+1}`;
                state.players.push({ name, score: 0, exactMatches: 0, sniperHits: 0 });
            }
            
            // Shuffle and pick products
            let shuffled = [...PRODUCTS].sort(() => 0.5 - Math.random());
            state.gameDeck = shuffled.slice(0, state.numRounds);
            
            state.currentRound = 0;
            startRound();
        }

        function startRound() {
            state.currentProduct = state.gameDeck[state.currentRound];
            state.guessesThisRound = [];
            state.currentPlayerIndex = 0;
            prepareNextPlayer();
        }

        function prepareNextPlayer() {
            if (state.currentPlayerIndex >= state.players.length) {
                // All guessed, reveal time
                doReveal();
                return;
            }
            // Show Pass screen
            let playerName = state.players[state.currentPlayerIndex].name;
            document.getElementById('pass-player-name').innerText = playerName;
            
            // Clear input for safety
            currentInputValue = "";
            updatePriceDisplay();

            showScreen('screen-pass');
        }

        // Guessing mechanics
        let currentInputValue = "";
        
        function typeNum(n) {
            if(currentInputValue.length < 9) {
                if(currentInputValue === "0") currentInputValue = n.toString();
                else currentInputValue += n.toString();
                updatePriceDisplay();
                playSfx('type');
                if(navigator.vibrate) navigator.vibrate(20);
            }
        }
        
        function deleteNum() {
            currentInputValue = currentInputValue.slice(0, -1);
            if(currentInputValue === "") currentInputValue = "0";
            updatePriceDisplay();
            playSfx('type');
        }

        function updatePriceDisplay() {
            document.getElementById('price-input').innerText = currentInputValue === "" ? "0" : Number(currentInputValue).toLocaleString();
        }

        function startGuessing() {
            showScreen('screen-guess');
            document.getElementById('prod-img').src = state.currentProduct.image_url;
            document.getElementById('prod-title').innerText = state.currentProduct.title;
            document.getElementById('prod-desc').innerText = state.currentProduct.description;
            currentInputValue = "0";
            updatePriceDisplay();

            // Timer
            let timeLeft = 20;
            const bar = document.getElementById('timer-bar');
            bar.style.width = '100%';
            bar.style.background = 'var(--success)';
            
            clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => {
                timeLeft--;
                let pct = (timeLeft / 20) * 100;
                bar.style.width = `${pct}%`;
                
                if (timeLeft <= 5) {
                    bar.style.background = 'var(--danger)';
                    playSfx('tick');
                    if(navigator.vibrate) navigator.vibrate(50);
                }
                
                if (timeLeft <= 0) {
                    clearInterval(state.timerInterval);
                    submitGuess(true); // timeout = 0
                }
            }, 1000);
        }

        function submitGuess(isTimeout = false) {
            clearInterval(state.timerInterval);
            let val = parseInt(currentInputValue) || 0;
            if(isTimeout) val = 0;

            state.guessesThisRound.push({
                player: state.players[state.currentPlayerIndex],
                guess: val
            });

            // Prevent double click
            const btn = document.querySelector('.numpad-action');
            btn.disabled = true;
            setTimeout(() => { btn.disabled = false; }, 500);

            state.currentPlayerIndex++;
            prepareNextPlayer();
        }

        // Reveal Phase
        function doReveal() {
            showScreen('screen-reveal');
            document.getElementById('btn-next-round').style.display = 'none';
            document.getElementById('actual-price-reveal').style.display = 'none';
            
            const list = document.getElementById('guesses-list');
            list.innerHTML = '';
            
            // Sort guesses by value to build tension
            let sortedGuesses = [...state.guessesThisRound].sort((a,b) => a.guess - b.guess);
            
            sortedGuesses.forEach((g, idx) => {
                let div = document.createElement('div');
                div.className = 'guess-card';
                div.id = `guess-card-${idx}`;
                div.innerHTML = `
                    <div style="font-weight:800; font-size:18px;">${g.player.name}</div>
                    <div style="font-weight:900; font-size:24px; color:white;">${g.guess.toLocaleString()}$</div>
                    <div class="points-badge" style="display:none; background:var(--accent); color:black; padding:2px 8px; border-radius:10px; font-weight:bold; font-size:12px;"></div>
                `;
                list.appendChild(div);
            });

            // Drumroll wait
            setTimeout(() => {
                playSfx('reveal');
                if(navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
                
                const reveal = document.getElementById('actual-price-reveal');
                reveal.innerText = `${state.currentProduct.actual_price.toLocaleString()}$`;
                reveal.style.display = 'block';
                reveal.style.animation = 'popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                
                calculateAndShowPoints(sortedGuesses);
            }, 2000);
        }

        function calculateAndShowPoints(sortedGuesses) {
            let actual = state.currentProduct.actual_price;
            
            // Calculate absolute diff for all guesses
            sortedGuesses.forEach(g => {
                g.diff = Math.abs(g.guess - actual);
            });
            
            setTimeout(() => {
                // Find minimum diff
                let minDiff = sortedGuesses.reduce((min, curr) => curr.diff < min ? curr.diff : min, Infinity);
                let winners = sortedGuesses.filter(g => g.diff === minDiff);
                
                winners.forEach(w => {
                    let pIndex = sortedGuesses.indexOf(w);
                    let badgeText = "";
                    
                    if (w.diff === 0) { // exact match
                        w.player.score += 30;
                        w.player.exactMatches++;
                        badgeText = "تطابق تام! (+30)";
                        document.getElementById(`guess-card-${pIndex}`).classList.add('exact');
                        playSfx('win');
                    } else {
                        let percentDiff = (w.diff / actual) * 100;
                        if (percentDiff <= 5) { // sniper (within 5%)
                            w.player.score += 20; 
                            w.player.sniperHits++;
                            badgeText = "قناص! (+20)";
                            playSfx('win');
                        } else {
                            w.player.score += 15;
                            badgeText = "الأقرب (+15)";
                        }
                    }
                    highlightWinner(pIndex, badgeText);
                });

                // Gray out losers
                sortedGuesses.forEach((g, i) => {
                    if(!document.getElementById(`guess-card-${i}`).classList.contains('winner') && !document.getElementById(`guess-card-${i}`).classList.contains('exact')) {
                        document.getElementById(`guess-card-${i}`).classList.add('over');
                    }
                });

                document.getElementById('btn-next-round').style.display = 'block';

            }, 1000);
        }

        function highlightWinner(index, text) {
            const card = document.getElementById(`guess-card-${index}`);
            card.classList.add('winner');
            const badge = card.querySelector('.points-badge');
            badge.style.display = 'block';
            badge.innerText = text;
        }

        function nextRoundAction() {
            state.currentRound++;
            if (state.currentRound >= state.numRounds) {
                endGame();
            } else {
                startRound();
            }
        }

        function endGame() {
            showScreen('screen-podium');
            
            let sorted = [...state.players].sort((a,b) => b.score - a.score);
            let podium = document.getElementById('podium-container');
            podium.innerHTML = '';
            
            // Build podium (2nd, 1st, 3rd)
            const places = [1, 0, 2]; // visual order
            places.forEach((i, idx) => {
                if (sorted[i]) {
                    let rankClass = `rank-${i+1}`;
                    let crownHtml = i === 0 ? '<div class="crown">👑</div>' : '';
                    podium.innerHTML += `
                        <div class="podium-place ${rankClass}" style="animation-delay: ${0.2 * idx}s">
                            ${crownHtml}
                            <div class="podium-score">${sorted[i].score}</div>
                            <div class="podium-bar">${i+1}</div>
                            <div class="podium-name">${sorted[i].name}</div>
                        </div>
                    `;
                }
            });

            // Stats
            let bestExact = [...state.players].sort((a,b) => b.exactMatches - a.exactMatches)[0];
            let bestSniper = [...state.players].sort((a,b) => b.sniperHits - a.sniperHits)[0];
            
            document.getElementById('stats-card').innerHTML = `
                <h3 style="color:var(--accent); margin-bottom:15px;">إحصائيات ممتعة 📊</h3>
                <p>أكثر تطابق تام: <strong>${bestExact && bestExact.exactMatches > 0 ? bestExact.name : 'لا أحد'}</strong></p>
                <p>قناص الجلسة: <strong>${bestSniper && bestSniper.sniperHits > 0 ? bestSniper.name : 'لا أحد'}</strong></p>
            `;
            
            playSfx('win');
        }
        
    </script>

e>'; document.body.appendChild(modal); } modal.style.display = 'flex'; }
</script>
